<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어디물어 · 이용 신청</title><link rel="stylesheet" href="style.css?v=1.14.0"></head><body><main class="login-view"><section class="login-card"><h1>어디물어 이용 신청</h1><p>관리자 승인 후 신청하신 이메일로 임시 비밀번호를 안내해 드려요.</p><form id="requestForm"><label>이메일 아이디<input name="loginId" type="email" maxlength="254" placeholder="test@gmail.com" required autocomplete="email" autocapitalize="none" spellcheck="false"></label><label>이름 또는 닉네임<input name="displayName" maxlength="40" required></label><label class="consent-row"><input id="signupConsent" name="consent" type="checkbox" required><span>가입 처리와 안내를 위한 이메일 아이디·이름 수집에 동의합니다. <strong>(필수)</strong></span></label><p class="hint">신청 정보는 처리 후 30일 이내 삭제합니다. 비밀번호나 집 주소는 적지 마세요. 일반 사용자는 로그인 후 10분간 이용할 수 있고, 로그인한 시각부터 24시간이 지나면 다시 이용할 수 있어요.</p><button id="registerSubmit" type="submit">가입 신청하기</button></form><p id="result" role="status" aria-live="polite" hidden></p><a class="back-to-login" href="./">로그인 화면으로 돌아가기</a></section></main><dialog id="registrationSuccess" class="registration-dialog" aria-labelledby="successTitle" aria-describedby="successDescription"><form method="dialog"><h2 id="successTitle">이용 신청이 접수되었어요</h2><p id="successDescription" style="white-space:pre-line">관리자가 확인한 뒤, 신청하신 이메일로 임시 비밀번호를 안내해 드리겠습니다. 조금만 기다려 주세요.</p><button type="submit" autofocus>확인</button></form></dialog><script src="config.js?v=1.14.0"></script><script src="telemetry.js?v=1.14.0"></script><script src="register.js?v=1.14.0" type="module"></script></body></html>
