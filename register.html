<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어디물어 · 이용 신청</title><link rel="stylesheet" href="style.css?v=1.3.0"></head><body><main class="login-view"><section class="login-card"><h1>어디물어 이용 신청</h1><p>관리자 승인 후 임시 비밀번호를 메시지로 보내드려요.</p><form id="requestForm"><label>이메일 아이디<input name="loginId" type="email" maxlength="254" placeholder="test@gmail.com" required autocomplete="email" autocapitalize="none" spellcheck="false"></label><label>이름 또는 닉네임<input name="displayName" maxlength="40" required></label><label>안내받을 연락 수단<input name="contact" minlength="3" maxlength="100" placeholder="이메일 또는 DM 아이디" required></label><label style="display:flex;align-items:center;gap:8px"><input name="consent" type="checkbox" style="width:auto" required>가입 처리와 안내를 위한 아이디·이름·연락 수단 수집에 동의합니다.</label><p class="hint">신청 정보는 처리 후 30일 이내 삭제합니다. 비밀번호나 집 주소는 적지 마세요. 일반 사용자는 로그인 후 10분간 이용할 수 있고, 로그인한 시각부터 24시간이 지나면 다시 이용할 수 있어요.</p><button>가입 신청하기</button></form><p id="result" role="status"></p><a href="./">로그인 화면으로</a></section></main><script src="config.js?v=1.3.0"></script><script src="register.js?v=1.3.0" type="module"></script></body></html>
