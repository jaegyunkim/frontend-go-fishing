<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="어디물어 — 출발지와 날짜만 말하면 바다 상태·포인트·가는 길·주변 정보를 정리해 주는 바다낚시 출조 AI 에이전트">
  <title>어디물어 · 바다낚시 출조 AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="assets/icon.svg" alt="" width="34" height="34">
        <div><h1>어디물어</h1><p>바다낚시 안전·출조 매니저</p></div>
      </div>
      <button id="btnSettings" class="icon-btn" aria-label="설정">⚙︎</button>
    </header>
    <div id="status" class="status" role="status"></div>
    <div id="chips" class="chips" aria-label="현재 조건"></div>

    <main>
      <section id="tab-chat" class="tab active" aria-label="대화">
        <div id="chat" class="chat" aria-live="polite"></div>
      </section>
      <section id="tab-brief" class="tab" aria-label="브리핑"><div id="brief" class="brief"><p class="empty">포인트를 고르면 상세 브리핑이 여기에 표시됩니다.</p></div></section>
      <section id="tab-points" class="tab" aria-label="포인트"><div id="points" class="points"></div></section>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <input id="msg" name="msg" placeholder="예) 이번주 토요일 부산 추천해줘" aria-label="메시지" maxlength="500">
      <button type="submit" aria-label="보내기">➤</button>
    </form>
    <nav class="tabs">
      <button data-tab="chat" class="active">💬<span>대화</span></button>
      <button data-tab="brief">🧭<span>브리핑</span></button>
      <button data-tab="points">📍<span>포인트</span></button>
    </nav>
  </div>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>서버 연결</h2>
      <p>이 페이지는 화면만 담당합니다. 공공데이터·지도·Notion 조회는 비공개 저장소 <b>backend-go-fishing</b> 서버가 처리합니다(키는 브라우저에 두지 않음).</p>
      <label>백엔드 주소<input id="apiBase" placeholder="https://go-fishing.example.com 또는 http://localhost:8787"></label>
      <p class="hint">맥미니 서버를 Cloudflare Tunnel 등으로 HTTPS 공개한 주소를 넣으세요. 같은 컴퓨터에서 서버를 켰다면 http://localhost:8787 도 됩니다. 주소창에 <code>?api=주소</code>로도 지정할 수 있어요.</p>
      <div class="row"><button value="save" id="saveApi">저장·연결 확인</button><button value="cancel" class="ghost">닫기</button></div>
      <button type="button" id="resetSession" class="ghost small">새 대화 시작(세션 초기화)</button>
    </form>
  </dialog>
  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
